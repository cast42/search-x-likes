[tox]
skipsdist = true
envlist = py314

[gh-actions]
python =
    3.14: py314

[testenv]
passenv =
    OPENAI_API_KEY
    PYTHON_VERSION
allowlist_externals = uv
commands =
    uv sync --python {envpython}
    uv run python -m pytest --doctest-modules tests --cov --cov-config=pyproject.toml --cov-report=xml
    uv run ty check
    uv run ty check --python-version 3.15

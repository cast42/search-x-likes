[project]
name = "search-x-likes"
version = "0.0.4"
description = "Search posts from x that you have liked yourself usign the archive download files"
authors = [{ name = "Lode Nachtergaele", email = "cast42@gmail.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.10,<4.0"
dependencies = [
    "bm25s>=0.3.13",
    "openai>=3.28.0",
    "pandas-stubs>=2.3.3.260113",
    "pandas>=2.3.3",
    "pystemmer>=3.1.0",
    "textual>=8.2.8",
    "fastparquet>=2026.9.0",
    "scikit-learn>=1.7.2",
    "python-dotenv>=1.2.4",
    "datasets>=5.1.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
    "model2vec>=0.9.0",
    "sentence-transformers>=6.1.0",
]

[project.urls]
Homepage = "https://cast42.github.io/search-x-likes/"
Repository = "https://github.com/cast42/search-x-likes"
Documentation = "https://cast42.github.io/search-x-likes/"

[tool.uv]
# Keep transitive dependencies above the patched Dependabot versions.
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "fsspec>=2026.6.0",
    "virtualenv>=21.7.13",
    # SciPy 1.15 wheels fail to load on Python 3.10 on Apple Silicon.
    "scipy>=1.14.1,<1.15; python_version < '3.11' and sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "tox-uv>=1.36.1",
    "deptry>=0.25.1",
    "mypy>=2.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[build-system]
requires = ["setuptools >= 84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["search_x_likes"]

[tool.mypy]
files = ["search_x_likes"]
disallow_untyped_defs = "True"
disallow_any_unimported = "True"
no_implicit_optional = "True"
check_untyped_defs = "True"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"
ignore_missing_imports = "True"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",

]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # type: ignore  # noqa: PGH003
    "PGH003"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["search_x_likes"]
